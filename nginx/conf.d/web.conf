server {
    listen 80;
    server_name localhost example.com www.example.com;

    root /usr/share/nginx/html/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://web-api:3000;
        include /etc/nginx/proxy_headers.conf;
    }
}