server {
    listen 80;
    server_name crm.localhost crm.example.com;

    root /usr/share/nginx/html/crm;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://crm-api:3000;
        include /etc/nginx/proxy_headers.conf;
    }
}