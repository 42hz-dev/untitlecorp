services:
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/conf.d/web.conf:/etc/nginx/conf.d/web.conf:ro
      - ./nginx/conf.d/crm.conf:/etc/nginx/conf.d/crm.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./web:/usr/share/nginx/html/web:ro
      - ./crm:/usr/share/nginx/html/crm:ro
    depends_on:
      - web-api
      - crm-api

  web-api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./web-api:/app
    command: sh -c "npm install && npm run start:dev"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${WEB_DB_USER}
      DB_PASSWORD: ${WEB_DB_PASSWORD}
      DB_NAME: web_db
    depends_on:
      - db

  crm-api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./crm-api:/app
    command: sh -c "npm install && npm run start:dev"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${CRM_DB_USER}
      DB_PASSWORD: ${CRM_DB_PASSWORD}
      DB_NAME: crm_db
    depends_on:
      - db

  db:
    image: mariadb:11.4
    command: --default-time-zone=+00:00
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ./db/data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
