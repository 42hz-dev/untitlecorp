services:
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./web:/usr/share/nginx/html/web:ro
      - ./crm:/usr/share/nginx/html/crm:ro
    depends_on:
      - web-api
      - crm-api

  web-api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./web-api:/app
    command: sh -c "npm install && npm run start:dev"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db

  crm-api:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./crm-api:/app
    command: sh -c "npm install && npm run start:dev"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    depends_on:
      - db

  db:
    image: mariadb:11.4
    command: --default-time-zone=+00:00
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
